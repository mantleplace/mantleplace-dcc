name: ci-manifest-conformance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-manifest-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the conformance gate itself
        run: python -m unittest discover -s tools/manifest-conformance -v

      - name: Check every registered host against the pinned verified-against.json
        if: github.event_name == 'pull_request'
        run: python tools/manifest-conformance/check_manifest_conformance.py --mode pinned

      - name: Check every registered host against the published schema
        if: github.event_name != 'pull_request'
        run: python tools/manifest-conformance/check_manifest_conformance.py --mode live

      - name: Test the mpb validator itself
        run: python -m unittest discover -s tools/mantleplace-mpb/tests -v

      - name: Install the mpb validator
        run: python -m pip install ./tools/mantleplace-mpb

      - name: Validate the corpus bundle group with mpb
        run: mpb corpus tools/manifest-conformance/corpus
