name: ci-blender-tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-blender-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blender-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the pure-core suite
        run: python -m unittest discover -s blender/tests -t blender -v
