name: ci-unreal-naming

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-unreal-naming-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit-test the gate
        working-directory: tools/unreal-naming
        run: python -m unittest discover -p "test_*.py" -v

      - name: Unit-test the Python QA helper
        working-directory: unreal/tools
        run: python -m unittest discover -p "test_*.py" -v

      - name: Check generated names
        run: python tools/unreal-naming/check_generated_names.py

      - name: Check third-party layout
        run: python tools/unreal-naming/check_third_party_layout.py
