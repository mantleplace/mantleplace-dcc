name: ci-public-hygiene

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-public-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit-test the gate
        working-directory: tools/public-hygiene
        run: python -m unittest discover -p "test_*.py" -v

      - name: Check every tracked file
        run: python tools/public-hygiene/check_public_references.py

      - name: Check documentation links, frontmatter and the ADR index
        run: python tools/public-hygiene/check_docs_integrity.py

      - name: Check the glossary's Avoid list in docs and user-visible strings
        run: python tools/public-hygiene/check_vocabulary.py

      - name: Check the pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          status=0
          printf '%s' "$PR_TITLE" | python tools/public-hygiene/check_public_references.py --stdin --label "PR title" || status=1
          printf '%s' "$PR_BODY" | python tools/public-hygiene/check_public_references.py --stdin --label "PR body" || status=1
          exit $status

      - name: Check the branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python tools/public-hygiene/check_public_references.py --branch-name "$HEAD_REF"

      - name: Check the commit messages this pull request introduces
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/public-hygiene/check_public_references.py --commit-range "$HEAD_SHA" --not "$BASE_SHA" origin/main

  powershell-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the gate refuses the broken case
        shell: pwsh
        run: ./tools/public-hygiene/Test-PowerShellParses.ps1 -Case -Path tools/public-hygiene/cases/powershell/broken.ps1

      - name: Parse every tracked PowerShell script
        shell: pwsh
        run: ./tools/public-hygiene/Test-PowerShellParses.ps1
