# Public hygiene — refuse references that only resolve inside a private repository.
#
# Everything in this repository is world-readable, permanently. CLAUDE.md has always said so and has
# always named the sharpest case: a bare hash-number reference auto-links to an issue in THIS
# repository, which is worse than dangling, because a reader following it lands somewhere real and
# unrelated.
#
# That was prose, and prose is not an enforcer. A private tracker's issue number reached a committed
# test comment and sat on main. This job is the difference between a rule and a gate — the same
# reason ci-manifest-conformance exists beside the sentence describing the contract.
#
# NO paths: FILTER ON pull_request, deliberately, and for the reason spelled out in
# ci-revit-tests.yml: a required check that is path-filtered never reports on a pull request outside
# its paths, so the check sits pending forever and nothing can merge. The gate is cheap — it reads
# tracked text files and talks to nothing — so running it on every pull request costs seconds.
#
# Hosted runner, stdlib only, no network. It cannot be broken by a registry outage or by the
# platform publishing anything. The pull-request surfaces (title, body, branch name, commit
# messages) come from the event payload and the local clone — still no network call.
name: ci-public-hygiene

on:
  pull_request:
    # The default types omit `edited`. Without it, a title or body edited after the checks went
    # green is never re-checked — which is exactly when a private reference gets pasted in.
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-public-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit-message check needs to walk the pull request's own commits
          # while excluding everything reachable from main. The repo is small; this costs little.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The gate's own cases first, and they assert BOTH directions. A gate that flags a Markdown
      # anchor or a hex colour is a gate somebody switches off within a week, and then it misses
      # the thing it was written for.
      - name: Unit-test the gate
        working-directory: tools/public-hygiene
        run: python -m unittest discover -p "test_*.py" -v

      - name: Check every tracked file
        run: python tools/public-hygiene/check_public_references.py

      # The metadata surfaces. Everything below reads the event payload or the clone — no network.
      #
      # ⛔ PR title, body and head_ref are attacker-controlled on a fork's pull request. They reach
      # the shell ONLY through env, never interpolated into `run:` — an expression inside the
      # script text would hand the author of a hostile PR body a shell on this runner.
      - name: Check the pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_TITLE" | python tools/public-hygiene/check_public_references.py --stdin --label "PR title"
          printf '%s' "$PR_BODY" | python tools/public-hygiene/check_public_references.py --stdin --label "PR body"

      - name: Check the branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python tools/public-hygiene/check_public_references.py --branch-name "$HEAD_REF"

      # `head --not base origin/main`, NOT `base..head`: a branch that merged a newer main would
      # pull main's own history into the plain range, and main's history contains messages that
      # predate this gate and are accepted as record. The exclusion confines the check to commits
      # this pull request is actually introducing.
      - name: Check the commit messages this pull request introduces
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/public-hygiene/check_public_references.py --commit-range "$HEAD_SHA" --not "$BASE_SHA" origin/main
