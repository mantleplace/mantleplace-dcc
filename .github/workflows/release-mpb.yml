# Release of the mantleplace-mpb package (the `mpb` validator and bundle reader) to PyPI.
#
# A release is a tag: `mpb-<version>`, where <version> is tools/mantleplace-mpb's __version__.
# That version is the MPB manifest version the conformance corpus is written against (plus `.postN`
# for a package-only release), and the build job refuses a tag that names anything else.
#
# PUBLISHING USES TRUSTED PUBLISHING (OIDC). There is no PyPI token anywhere: not in this
# repository, not in its settings. The `publish` job alone may mint the short-lived identity token,
# and PyPI accepts it only from this repository, this workflow file and the `pypi` environment.
# That environment is where a release is approved: give it required reviewers, and a tag push
# waits there until a maintainer says go. One-time setup on PyPI is a pending publisher for the
# project `mantleplace-mpb` naming owner `mantleplace`, repository `mantleplace-dcc`, workflow
# `release-mpb.yml` and environment `pypi`.
#
# A manual run (workflow_dispatch) builds and checks everything and publishes nothing.
#
# Hosted runner on purpose, like every gate here. It does not run on a push to a branch or on a
# change to a branch's diff, so it costs nothing until a maintainer cuts a tag.
name: release-mpb

on:
  push:
    tags:
      - 'mpb-*'
  workflow_dispatch:

concurrency:
  group: release-mpb-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hold the package to the conformance suite and the tag
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python tools/mantleplace-mpb/release_check.py --tag "$TAG"
          else
            python tools/mantleplace-mpb/release_check.py
          fi

      - name: Test the package
        run: python -m unittest discover -s tools/mantleplace-mpb/tests -v

      - name: Build the distributions
        run: |
          python -m pip install build twine
          python -m build tools/mantleplace-mpb

      - name: Check the distributions
        run: python -m twine check --strict tools/mantleplace-mpb/dist/*

      # What PyPI will serve, installed the way a user installs it, and run over the corpus.
      - name: Install the built wheel and validate the corpus with it
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/pip" install tools/mantleplace-mpb/dist/*.whl
          "$RUNNER_TEMP/wheel-check/bin/mpb" --version
          "$RUNNER_TEMP/wheel-check/bin/mpb" corpus tools/manifest-conformance/corpus

      - uses: actions/upload-artifact@v4
        with:
          name: mantleplace-mpb-dist
          path: tools/mantleplace-mpb/dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mantleplace-mpb/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mantleplace-mpb-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
