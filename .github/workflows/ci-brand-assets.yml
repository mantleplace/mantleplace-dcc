name: ci-brand-assets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-brand-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mark-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit-test the mark geometry
        working-directory: tools/brand-assets
        run: python -m unittest discover -p "test_*.py" -v
