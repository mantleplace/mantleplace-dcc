name: ci-comments

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-comments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that no file holds more comment lines than the baseline allows
        run: node tools/comment-ratchet/comment-ratchet.mjs check --base origin/main
