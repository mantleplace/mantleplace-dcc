name: ci-platform-api

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-platform-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: shared/global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the vendored client against the served spec
        run: python shared/tools/platform-api/sync_platform_api.py --check
