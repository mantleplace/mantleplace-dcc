# Platform API client sync: the vendored generated client must be what the served spec generates.
#
# The Revit plugin calls the Platform API through MantlePlace.PlatformApi, an NSwag client generated
# from https://mantle.place/api/v1/openapi.json and vendored under
# revit/src/MantlePlace.PlatformApi/Generated/. This job fetches the served spec, runs the pinned
# generator (revit/.config/dotnet-tools.json) and fails when either vendored file would change. The
# fix is always the same: run `python revit/tools/platform-api/sync_platform_api.py` and commit.
#
# It reads a live URL, so it runs on main, weekly and on demand, never on a pull request: a platform
# deploy moves the spec without this repo changing, and a pull request must not go red for that (the
# same reason the manifest conformance gate keeps its live mode off pull requests). A red run here
# means: sync and commit. The generator is a dotnet tool restored here; ci-revit-tests still restores
# no package, because the assemblies the plugin ships reference none.
name: ci-platform-api

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-platform-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: revit/global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the vendored client against the served spec
        run: python revit/tools/platform-api/sync_platform_api.py --check
