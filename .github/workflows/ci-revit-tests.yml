name: ci-revit-tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "revit/**"
      - "shared/**"
      - "tools/manifest-conformance/corpus/**"
      - "tools/manifest-conformance/verified-against.json"
  workflow_dispatch:

concurrency:
  group: ci-revit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: shared/global.json

      - name: Build the pure core, the client and their suite
        run: dotnet build shared/tests/MantlePlace.Core.Tests/MantlePlace.Core.Tests.csproj -c Release

      - name: Drive the shared conformance corpus on .NET 8 (Revit 2025, 2026)
        run: dotnet run --project shared/tests/MantlePlace.Core.Tests/MantlePlace.Core.Tests.csproj -c Release -f net8.0 --no-build

      - name: Drive the shared conformance corpus on .NET 10 (Revit 2027)
        run: dotnet run --project shared/tests/MantlePlace.Core.Tests/MantlePlace.Core.Tests.csproj -c Release -f net10.0 --no-build

  pure-core-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: shared/global.json

      - name: Build the pure core, the client and their suite
        run: dotnet build shared/tests/MantlePlace.Core.Tests/MantlePlace.Core.Tests.csproj -c Release

      - name: Drive the shared conformance corpus on .NET 8 (Revit 2025, 2026)
        run: dotnet run --project shared/tests/MantlePlace.Core.Tests/MantlePlace.Core.Tests.csproj -c Release -f net8.0 --no-build

      - name: Drive the shared conformance corpus on .NET 10 (Revit 2027)
        run: dotnet run --project shared/tests/MantlePlace.Core.Tests/MantlePlace.Core.Tests.csproj -c Release -f net10.0 --no-build
