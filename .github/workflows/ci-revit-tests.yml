# Revit pure-core tests — the headless half of the Revit plugin's triad.
#
# HPS-42: conformance tests run headless, with no DCC application required. That is the whole
# reason the protocol lives in MantlePlace.Revit.Core with the Revit API nowhere near it — a suite
# that needs a licensed Revit install is a suite that runs when someone remembers.
#
# So this job builds and runs the pure core, the client and their conformance suite. The add-in
# shim (MantlePlace.Revit.Addin) references RevitAPI.dll from a local Autodesk install and is
# deliberately NOT built here: a hosted runner has no Revit, and there is no honest way to fake it.
# The shim is compiled on a developer machine — `dotnet build revit/MantlePlace.Revit.slnx` — and
# proven by the tester import gate, not by CI. Skipping it silently would be the failure mode this
# comment exists to prevent, so: it is skipped, on purpose, and this is where that is written down.
#
# MantlePlace.Revit.Client is in scope even though it does real I/O. It references no Revit API, so
# a hosted runner can build and run it — which is what turns ⛔HPS-26's second enforcer
# (`automation-test`, on the write-to-.part-then-rename path) from a promise into a job.
#
# Hosted runner, and no NuGet restore: the tree has zero package references (revit/Directory.Build.props),
# so this job cannot be broken by a registry outage or a transitive bump.
name: ci-revit-tests

on:
  pull_request:
    paths:
      - "revit/**"
      - "tools/manifest-conformance/corpus/**"
      # A pin bump can touch nothing but this file, and it is exactly the change whose claim
      # ("the parser was exercised against that shape") this job is the evidence for.
      - "tools/manifest-conformance/verified-against.json"
      - ".github/workflows/ci-revit-tests.yml"
  push:
    branches: [main]
    paths:
      - "revit/**"
      - "tools/manifest-conformance/corpus/**"
      # A pin bump can touch nothing but this file, and it is exactly the change whose claim
      # ("the parser was exercised against that shape") this job is the evidence for.
      - "tools/manifest-conformance/verified-against.json"
  workflow_dispatch:

concurrency:
  group: ci-revit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false # the suite reads JSON vectors and C#; no binary payload is involved

      # Two runtimes, because the shipped add-in is ONE net8.0-windows assembly that Revit 2025 and
      # 2026 load on .NET 8 and Revit 2027 loads on .NET 10. Supporting three Revit versions from one
      # build is a forward-compatibility bet; running the suite on both runtimes is the cheapest
      # honest test of it. The 8.0 runtime comes first so the 10.0 SDK from global.json stays the
      # one that drives the build.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: revit/global.json

      - name: Build the pure core, the client and their suite
        run: dotnet build revit/tests/MantlePlace.Revit.Core.Tests/MantlePlace.Revit.Core.Tests.csproj -c Release

      # The corpus is checked into this repo, and the reader FAILS rather than skips when it cannot
      # reach it (HPS-40). A green run here therefore means cases actually ran.
      - name: Drive the shared conformance corpus on .NET 8 (Revit 2025, 2026)
        run: dotnet run --project revit/tests/MantlePlace.Revit.Core.Tests/MantlePlace.Revit.Core.Tests.csproj -c Release -f net8.0 --no-build

      - name: Drive the shared conformance corpus on .NET 10 (Revit 2027)
        run: dotnet run --project revit/tests/MantlePlace.Revit.Core.Tests/MantlePlace.Revit.Core.Tests.csproj -c Release -f net10.0 --no-build
