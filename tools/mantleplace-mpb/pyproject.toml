[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mantleplace-mpb"
dynamic = ["version"]
description = "Validate and read Mantle Place Bundles (MPB): every file with its frame and ODbL role."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mantle Place LLC" }]
keywords = ["mpb", "mantleplace", "geospatial", "site-context", "gis", "bundle", "validator"]
requires-python = ">=3.10"
# Standard library only, on purpose: no GDAL, no PROJ, nothing compiled. It runs wherever Python does.
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mantleplace/mantleplace-dcc/tree/main/tools/mantleplace-mpb"
Specification = "https://github.com/mantleplace/mantleplace-dcc/tree/main/spec"
Repository = "https://github.com/mantleplace/mantleplace-dcc"
Issues = "https://github.com/mantleplace/mantleplace-dcc/issues"
Changelog = "https://github.com/mantleplace/mantleplace-dcc/releases"

[project.scripts]
mpb = "mantleplace_mpb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "mantleplace_mpb.__version__" }

[tool.setuptools.package-data]
mantleplace_mpb = ["py.typed"]
